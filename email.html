<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Generator | WISHY TOOLS</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><div class="bg"></div><div class="overlay"></div><header class="topbar glass"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WISHY TOOLS</span></a><button id="themeToggle" class="icon-btn">☾</button></header><main class="shell tool-page"><a class="back-link" href="index.html">← Back to tools</a><section class="tool-panel glass"><div class="tool-head"><h1>Email Generator</h1><p>Enter a domain you control and choose how the email name should be generated.</p></div><div class="tool-body"><label>Domain<input id="emailDomainInput" type="text" placeholder="example.com"></label><label>Email name style<select id="emailStyle"><option value="name-number">Name + number</option><option value="alphabet">Alphabet only</option><option value="number">Number only</option></select></label><label>Quantity<input id="emailCount" type="number" min="1" max="100" value="10"></label><button id="generateEmails" class="primary full">Generate Emails</button><textarea id="emailOutput" class="output" readonly placeholder="olivia482@example.com"></textarea><button class="ghost full" data-copy="emailOutput">Copy Emails</button><p class="note">This only generates address strings. Receiving mail still requires your own mail-routing setup for the domain.</p></div></section></main><script src="app.js"></script></body></html>
