<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Text Formatter | WISHY TOOLS</title><link rel="stylesheet" href="styles.css"></head><body><div class="bg"></div><div class="overlay"></div><header class="topbar glass"><a class="brand" href="index.html"><span class="brand-mark">W</span><span>WISHY TOOLS</span></a><button id="themeToggle" class="icon-btn">☾</button></header><main class="shell tool-page"><a class="back-link" href="index.html">← Back to tools</a><section class="tool-panel glass"><div class="tool-head"><p class="eyebrow">TEXT UTILITY</p><h1>TEXT FORMATTER</h1><p>Clean, transform, decorate, and copy text quickly.</p></div><div class="tool-body"><label>Input<textarea id="textInput" class="output text-editor" placeholder="Type or paste your text here…"></textarea></label><div class="row four"><label>Case<select id="textCase"><option value="none">Keep case</option><option value="upper">UPPERCASE</option><option value="lower">lowercase</option><option value="title">Title Case</option><option value="sentence">Sentence case</option></select></label><label>Line mode<select id="lineMode"><option value="keep">Keep lines</option><option value="trim">Trim each line</option><option value="number">Number lines</option><option value="bullets">Bullet lines</option></select></label><label>Prefix<input id="textPrefix" placeholder="Optional prefix"></label><label>Suffix<input id="textSuffix" placeholder="Optional suffix"></label></div><div class="format-actions"><button class="ghost" data-text-action="spaces">Remove extra spaces</button><button class="ghost" data-text-action="blank">Remove blank lines</button><button class="ghost" data-text-action="reverse">Reverse lines</button><button class="ghost" data-text-action="sort">Sort lines</button></div><button id="formatText" class="primary full">Format Text</button><textarea id="textOutput" class="output text-editor" readonly placeholder="Formatted text will appear here…"></textarea><div class="actions"><button id="copyTextOutput" class="ghost">Copy</button><button id="clearText" class="ghost">Clear</button></div></div></section></main><script src="app.js"></script></body></html>
